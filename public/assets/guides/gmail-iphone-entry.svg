<svg xmlns="http://www.w3.org/2000/svg" width="380" height="310" viewBox="0 0 380 310">
<title>Gmail 的 iPhone 注册入口示意</title>
<rect width="380" height="310" rx="16" fill="#f4f7fa"/>
<g font-family="-apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif">
<text x="24" y="35" font-size="22" font-weight="700" fill="#176447">Gmail</text>
<text x="24" y="62" font-size="15" fill="#485967">iPhone 注册入口示意</text>
<rect x="22" y="84" width="336" height="56" rx="12" fill="white" stroke="#cbd6df"/><circle cx="52" cy="112" r="15" fill="#176447"/><text x="52" y="117" text-anchor="middle" fill="white" font-size="16">1</text><text x="80" y="119" fill="#162635" font-size="19">登录，或点右上角头像</text>
<path d="M52 140v14m-4-4 4 4 4-4" fill="none" stroke="#176447" stroke-width="2"/>
<rect x="22" y="158" width="336" height="56" rx="12" fill="white" stroke="#cbd6df"/><circle cx="52" cy="186" r="15" fill="#176447"/><text x="52" y="191" text-anchor="middle" fill="white" font-size="16">2</text><text x="80" y="193" fill="#162635" font-size="19">添加账号时选择 Google</text>
<path d="M52 214v14m-4-4 4 4 4-4" fill="none" stroke="#176447" stroke-width="2"/>
<rect x="22" y="232" width="336" height="56" rx="12" fill="white" stroke="#cbd6df"/><circle cx="52" cy="260" r="15" fill="#176447"/><text x="52" y="265" text-anchor="middle" fill="white" font-size="16">3</text><text x="80" y="267" fill="#162635" font-size="19">创建账号 → 个人用途</text>
</g></svg>
